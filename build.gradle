plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.74'
}

version = '1.0.0'
group = 'com.xing_yu_dragon.fixdereassembler'

base {
    archivesName = 'eazy_tac_fix'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        eazy_tac_fix {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // 编译期引用 data_energistics 的配方类做 Mixin 注入；运行时该 mod 已在 mods 里，无需打包
    compileOnly files('../data_energistics-1.21.1-3.3.5.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
